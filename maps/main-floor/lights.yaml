# Main floor lights, traced from the white dots on the Floorplanner export.
# x / y are map cells (or a `fixtures` list of x/y when one entity drives several fixtures,
#   or `strip: {x0, y0, x1, y1}` for an LED strip; `rgb: true` strips glow in their color) (1 cell = 6 inches, 0,0 = top-left of main-floor.png, 8 px per cell).
# entity: the real Home Assistant entity (light.*, switch.* or fan.*; covers are cover.*), confirmed with chris 2026-11-23.
#   The card's `entities:` option can override any of them by id without editing this file.
# radius: how far the glow reaches, in cells. Glow never passes through walls or closed doors.

floor: main
image: main-floor.png
layout: main-floor.json

# Tap targets for the room view. Each groups one or more layout rooms (from main-floor.json);
# "outside" covers the front porch, yard, deck and driveway.
rooms:
  # open plan: living, dining and kitchen act as one room, with the hall, foyer and accent strip
  - {id: living,      name: "Living, kitchen & dining", includes: [living, stairs, dining, kitchen, hall, front_closet]}
  - {id: master,      name: Master,       includes: [master, master_closet]}
  - {id: master_bath, name: Master bath,  includes: [master_bath]}
  - {id: main_bath,   name: Main bath,    includes: [main_bath]}
  - {id: g_room,      name: G's room,     includes: [g_room, g_closet]}
  - {id: m_bedroom,   name: M's room,     includes: [m_bedroom, m_closet]}
  - {id: mud_room,    name: Mud room,     includes: [mud_room]}
  - {id: garage,      name: Garage,       includes: [garage]}
  - {id: outside,     name: Outside,      includes: [outside, porch]}   # front porch, yard, deck and driveway

lights:
  - id: dining
    name: Dining room
    room: dining
    entity: switch.dining_room_light
    x: 68.0
    y: 14.0
    radius: 16
    style: globes        # brass chandelier with white globes

  - id: kitchen
    name: Kitchen
    room: kitchen
    entity: switch.kitchen_light
    x: 94.9
    y: 15.0
    radius: 22

  - id: kitchen_counter
    name: Kitchen counter
    room: kitchen
    entity: light.counter_light
    x: 84.6
    y: 10.3
    radius: 12
    style: pendants      # two glass pendants over the peninsula

  - id: kitchen_sink
    name: Kitchen sink
    room: kitchen
    entity: light.sink_light
    x: 93.5
    y: 6.7
    radius: 10

  - id: upper_cabinet
    name: Upper cabinet strip
    room: kitchen
    entity: light.kitchen_cabinet
    rgb: true
    color: [120, 200, 255]   # preview color; in HA the strip's real color is used
    strip: {x0: 102.4, y0: 9.8, x1: 102.4, y1: 21.6}
    radius: 6

  - id: hall_accent
    name: Hall accent strip
    room: hall
    entity: light.trim_light
    rgb: true
    color: [190, 110, 255]
    strip: {x0: 34.2, y0: 40.6, x1: 49.6, y1: 40.6}
    radius: 6

  - id: entry
    name: Entry
    room: hall
    entity: switch.foyer_light
    x: 56.0
    y: 47.9
    radius: 18

  - id: hall
    name: Hallway
    room: hall
    entity: switch.hall_light
    x: 29.7
    y: 47.3
    radius: 14

  - id: master_closet
    name: Master closet strip
    room: master_closet
    entity: light.master_closet_light_2
    rgb: true
    color: [255, 170, 90]
    strip: {x0: 5.4, y0: 5.8, x1: 5.4, y1: 30.2}
    radius: 5

  - id: master_bath
    name: Master bath
    room: master_bath
    entity: switch.switch_3
    x: 12.6
    y: 36.3
    radius: 14

  - id: main_bath
    name: Main bath
    room: main_bath
    entity: switch.switch_2
    x: 13.0
    y: 46.0
    radius: 14

  - id: m_bedroom
    name: M bedroom
    room: m_bedroom
    entity: light.m_bedroom_light
    x: 41.1
    y: 59.4
    radius: 22

  - id: mud_room
    name: Mud room
    room: mud_room
    entity: switch.back_hall_light
    x: 97.6
    y: 29.5
    radius: 18

  - id: garage
    name: Garage
    room: garage
    entity: switch.work_lights_on_off
    x: 81.7
    y: 52.7
    radius: 32

  - id: porch
    name: Porch lights
    room: porch
    entity: switch.porch
    radius: 18
    fixtures:            # one entity, two fixtures
      - {x: 52.5, y: 63.4}
      - {x: 59.6, y: 63.4}

  - id: castle_lights
    name: Castle lights
    room: m_bedroom
    entity: switch.third_reality_inc_3rsp02028bz
    color: [255, 214, 150]   # warm glow in the castle's play nook
    x: 46.0
    y: 66.5
    radius: 9

  - id: master_fan_light
    name: Master fan light
    room: master
    entity: light.master_bedroom_master_bedroom_fan_light
    x: 19.7
    y: 16.8
    radius: 26

  - id: g_room_fan_light
    name: G room fan light
    room: g_room
    entity: light.ceiling_fan_light
    x: 17.0
    y: 61.0
    radius: 22

  - id: back_door
    name: Back exterior
    room: outside
    entity: switch.switch
    x: 79.4
    y: 3.4
    radius: 12

  - id: garage_front
    name: Garage front
    room: outside
    entity: switch.outdoor1
    radius: 12
    fixtures:            # one entity, two fixtures on either side of the garage door
      - {x: 66.3, y: 77.8}
      - {x: 100.2, y: 77.6}

# Window blinds (Home Assistant cover entities). The window spans cols c0..c1 on wall row `row`.
covers:
  - id: living_blinds
    name: Living room blinds
    room: living
    entity: cover.cellular_shade_radio_z_wave
    row: 4
    c0: 40
    c1: 50

  - id: m_bedroom_blinds
    name: M bedroom blinds
    room: m_bedroom
    entity: cover.m_bedroom_blinds_cover
    row: 69
    c0: 38
    c1: 44

  - id: g_room_blinds
    name: G room blinds
    room: g_room
    entity: cover.g_bedroom_blinds_window_covering
    row: 69
    c0: 14
    c1: 19

  - id: master_blinds
    name: Master blinds
    room: master
    entity: cover.master_blinds_cover
    row: 4
    c0: 18
    c1: 25

  # Garage door: shows open/closed on the map and starts blinking once it has been open
  # `alert_after_min` minutes (HA's last_changed on the cover). See ha/garage_door_alert.yaml for the phone alert.
  - id: garage_door
    name: Garage door
    room: garage
    entity: cover.garage_door
    kind: garage
    row: 75
    c0: 68
    c1: 97
    alert_after_min: 35

# Ceiling fans, controlled separately from their light kits (listed above as *_fan_light).
# Tap the blades to toggle the fan, the center to toggle its light.
fans:
  - id: master_fan
    name: Master fan
    room: master
    entity: fan.master_bedroom_master_bedroom_fan_fan
    x: 19.7
    y: 16.8
    blade: [70, 52, 44]
  - id: g_room_fan
    name: G room fan
    room: g_room
    entity: fan.ceiling_fan
    x: 17.0
    y: 61.0
    blade: [196, 182, 170]

# Day and night: the outside light follows the sun's elevation (HA sun.sun), and rain shows on the
# yard, deck and driveway when the weather entity says it's raining.
# latitude/longitude are only used by the offline preview (rough central US placeholder); in HA, sun.sun already knows.
sky:
  sun: sun.sun
  weather: weather.home
  latitude: 39.0
  longitude: -94.6

# The dog wanders between these spots (cells) and naps on its bed.
dog:
  name: Dog
  bed: {x: 41.5, y: 18}
  spots:
    - {x: 70, y: 22}     # under the dining table
    - {x: 92, y: 16}     # kitchen, hoping for crumbs
    - {x: 96, y: 31}     # mud room door
    - {x: 56, y: 50}     # front door
    - {x: 30, y: 46}     # hallway
    - {x: 40, y: 56}     # M's room
    - {x: 22, y: 58}     # G's room
    - {x: 26, y: 24}     # foot of the master bed
