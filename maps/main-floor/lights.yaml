# Main floor lights, traced from the white dots on the Floorplanner export.
# x / y are map cells (or a `fixtures` list of x/y when one entity drives several fixtures,
#   or `strip: {x0, y0, x1, y1}` for an LED strip; `rgb: true` strips glow in their color) (1 cell = 6 inches, 0,0 = top-left of main-floor.png, 8 px per cell).
# entity: placeholder Home Assistant ids. Replace each with the real one
#   (Settings > Devices & services > Entities, or Developer tools > States).
# radius: how far the glow reaches, in cells. Glow never passes through walls or closed doors.

floor: main
image: main-floor.png
layout: main-floor.json

lights:
  - id: living
    name: Living room
    room: living
    entity: light.living_room
    x: 55.2
    y: 10.2           # nudged down from 6.8 so it doesn't sit on the record player
    radius: 26

  - id: record_player_lamp
    name: Record player lamp
    room: living
    entity: light.record_player_lamp
    x: 58.6
    y: 6.6
    radius: 10

  - id: kitchen
    name: Kitchen
    room: kitchen
    entity: light.kitchen
    x: 94.9
    y: 15.0
    radius: 22

  - id: kitchen_counter
    name: Kitchen counter
    room: kitchen
    entity: light.kitchen_counter
    x: 84.6
    y: 10.3
    radius: 12

  - id: kitchen_sink
    name: Kitchen sink
    room: kitchen
    entity: light.kitchen_sink
    x: 93.5
    y: 6.7
    radius: 10

  - id: upper_cabinet
    name: Upper cabinet strip
    room: kitchen
    entity: light.upper_cabinet
    rgb: true
    color: [120, 200, 255]   # preview color; in HA the strip's real color is used
    strip: {x0: 102.4, y0: 9.8, x1: 102.4, y1: 21.6}
    radius: 6

  - id: hall_accent
    name: Hall accent strip
    room: hall
    entity: light.hall_accent
    rgb: true
    color: [190, 110, 255]
    strip: {x0: 34.2, y0: 40.6, x1: 49.6, y1: 40.6}
    radius: 6

  - id: entry
    name: Entry
    room: hall
    entity: light.entry
    x: 56.0
    y: 47.9
    radius: 18

  - id: hall
    name: Hallway
    room: hall
    entity: light.hallway
    x: 29.7
    y: 47.3
    radius: 14

  - id: master_closet
    name: Master closet strip
    room: master_closet
    entity: light.master_closet
    rgb: true
    color: [255, 170, 90]
    strip: {x0: 5.4, y0: 5.8, x1: 5.4, y1: 30.2}
    radius: 5

  - id: master_bath
    name: Master bath
    room: master_bath
    entity: light.master_bath
    x: 12.6
    y: 36.3
    radius: 14

  - id: main_bath
    name: Main bath
    room: main_bath
    entity: light.main_bath
    x: 13.0
    y: 46.0
    radius: 14

  - id: m_bedroom
    name: M bedroom
    room: m_bedroom
    entity: light.m_bedroom
    x: 41.1
    y: 59.4
    radius: 22

  - id: mud_room
    name: Mud room
    room: mud_room
    entity: light.mud_room
    x: 97.6
    y: 29.5
    radius: 18

  - id: garage
    name: Garage
    room: garage
    entity: light.garage
    x: 81.7
    y: 52.7
    radius: 32

  - id: porch
    name: Porch lights
    room: porch
    entity: light.porch
    radius: 18
    fixtures:            # one entity, two fixtures
      - {x: 52.5, y: 63.4}
      - {x: 59.6, y: 63.4}

  - id: master_fan_light
    name: Master fan light
    room: master
    entity: light.master_fan
    x: 19.7
    y: 16.8
    radius: 26

  - id: g_room_fan_light
    name: G room fan light
    room: g_room
    entity: light.g_room_fan
    x: 17.0
    y: 61.0
    radius: 22

  - id: back_door
    name: Back exterior
    room: outside
    entity: light.back_exterior
    x: 79.4
    y: 3.4
    radius: 12

  - id: garage_front
    name: Garage front
    room: outside
    entity: light.garage_front
    radius: 12
    fixtures:            # one entity, two fixtures on either side of the garage door
      - {x: 66.3, y: 77.8}
      - {x: 100.2, y: 77.6}

# Window blinds (Home Assistant cover entities). The window spans cols c0..c1 on wall row `row`.
covers:
  - id: m_bedroom_blinds
    name: M bedroom blinds
    room: m_bedroom
    entity: cover.m_bedroom_blinds
    row: 69
    c0: 38
    c1: 44

  - id: g_room_blinds
    name: G room blinds
    room: g_room
    entity: cover.g_room_blinds
    row: 69
    c0: 14
    c1: 19

  - id: master_blinds
    name: Master blinds
    room: master
    entity: cover.master_blinds
    row: 4
    c0: 18
    c1: 25

# Ceiling fans, controlled separately from their light kits (listed above as *_fan_light).
# Tap the blades to toggle the fan, the center to toggle its light.
fans:
  - id: master_fan
    name: Master fan
    room: master
    entity: fan.master
    x: 19.7
    y: 16.8
    blade: [70, 52, 44]
  - id: g_room_fan
    name: G room fan
    room: g_room
    entity: fan.g_room
    x: 17.0
    y: 61.0
    blade: [196, 182, 170]
