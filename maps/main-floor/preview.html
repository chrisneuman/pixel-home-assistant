<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Main floor map preview</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #1b1724; color: #f2ead8; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 16px; margin: 4px 0 10px; letter-spacing: .5px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  button { font: inherit; background: #3a2f48; color: #f2ead8; border: 2px solid #120e18; box-shadow: inset 0 -3px 0 #241d2e;
           padding: 6px 12px; cursor: pointer; }
  button:active { transform: translateY(1px); box-shadow: none; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  .stage { position: relative; border: 4px solid #120e18; background: #000; line-height: 0; }
  canvas { width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; cursor: pointer; }
  .tip { position: absolute; pointer-events: none; background: #120e18; color: #ffe9a8; padding: 3px 6px; font-size: 12px; line-height: 1.2;
         transform: translate(-50%, -140%); white-space: nowrap; display: none; border: 2px solid #4b3d5c; }
  .legend { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 12px; }
  .legend div { cursor: pointer; }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 2px solid #120e18; background: #77708a; vertical-align: -2px; }
  .on .dot { background: #ffd95a; box-shadow: 0 0 6px #ffd95a; }
  .note { opacity: .7; margin-top: 10px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Main floor &middot; tap a light to toggle it</h1>
  <div class="bar">
    <button id="allOn">All on</button>
    <button id="allOff">All off</button>
    <label>Night <input id="dark" type="range" min="0" max="0.8" step="0.05" value="0.55"></label>
    <label><input id="labels" type="checkbox"> Room labels</label>
  </div>
  <div class="stage" id="stage"><canvas id="c"></canvas><div class="tip" id="tip"></div></div>
  <div class="legend" id="legend"></div>
  <div class="note">Preview with mock state. In Home Assistant the same renderer reads each light's real state and toggles it on tap.</div>
</div>

const CELL = LAYOUT.cell_px, W = LAYOUT.width, H = LAYOUT.height;
const PW = W * CELL, PH = H * CELL;
const canvas = document.getElementById('c');
canvas.width = PW; canvas.height = PH;
const ctx = canvas.getContext('2d');
const tiles = LAYOUT.tiles;
const lights = CONFIG.lights.map((l, i) => ({ ...l, on: false, level: 0, phase: i * 1.7 }));
let darkness = 0.55, showLabels = false;

// ---- glow zones: flood fill from each light, stopping at walls and closed doors
const INDOOR = new Set([' ', 'S']);
const OUTDOOR = new Set(['.', 'd', 'p']);
function tileAt(c, r) { return (r < 0 || r >= H || c < 0 || c >= W) ? '#' : tiles[r][c]; }
function buildZone(l) {
  const c0 = Math.floor(l.x), r0 = Math.floor(l.y);
  const start = tileAt(c0, r0);
  const pass = OUTDOOR.has(start) ? OUTDOOR : INDOOR;
  const R = l.radius + 1, seen = new Uint8Array(W * H), q = [[c0, r0]];
  seen[r0 * W + c0] = 1;
  while (q.length) {
    const [c, r] = q.pop();
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nr < 0 || nc >= W || nr >= H || seen[nr * W + nc]) continue;
      if (Math.hypot(nc + .5 - l.x, nr + .5 - l.y) > R) continue;
      if (!pass.has(tiles[nr][nc])) continue;
      seen[nr * W + nc] = 1; q.push([nc, nr]);
    }
  }
  // spill one cell onto bounding walls/doors so their edges catch the light
  const out = seen.slice();
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    if (!seen[r * W + c]) continue;
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc >= 0 && nr >= 0 && nc < W && nr < H && !pass.has(tiles[nr][nc])) out[nr * W + nc] = 1;
    }
  }
  const m = document.createElement('canvas'); m.width = PW; m.height = PH;
  const mc = m.getContext('2d'); mc.fillStyle = '#fff';
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (out[r * W + c]) mc.fillRect(c * CELL, r * CELL, CELL, CELL);
  return m;
}
lights.forEach(l => { l.zone = buildZone(l); });

// interior mask: where "night" darkness applies strongest (everything gets some)
const scratch = document.createElement('canvas'); scratch.width = PW; scratch.height = PH;
const sc = scratch.getContext('2d');
const dark = document.createElement('canvas'); dark.width = PW; dark.height = PH;
const dc = dark.getContext('2d');

// stepped radial light shape: hard bands read as pixel art
function lightShape(g, l, alpha, flick) {
  const x = l.x * CELL, y = l.y * CELL, R = l.radius * CELL * flick;
  const grad = g.createRadialGradient(x, y, 0, x, y, R);
  const bands = [[0, 1], [.35, .85], [.6, .6], [.8, .35], [1, 0]];
  for (let i = 0; i < bands.length - 1; i++) {
    const [p, a] = bands[i], [p2] = bands[i + 1];
    grad.addColorStop(p, `rgba(255,255,255,${a * alpha})`);
    grad.addColorStop(Math.max(p, p2 - .001), `rgba(255,255,255,${a * alpha})`);
  }
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(x - R, y - R, R * 2, R * 2);
}
function maskedLight(l, alpha, flick, tint) {
  sc.globalCompositeOperation = 'source-over';
  sc.clearRect(0, 0, PW, PH);
  lightShape(sc, l, alpha, flick);
  sc.globalCompositeOperation = 'destination-in';
  sc.drawImage(l.zone, 0, 0);
  if (tint) { sc.globalCompositeOperation = 'source-in'; sc.fillStyle = tint; sc.fillRect(0, 0, PW, PH); }
  return scratch;
}

const map = new Image();
map.src = MAP_SRC;

function drawBulb(l, t, now) {
  const x = Math.round(l.x * CELL), y = Math.round(l.y * CELL);
  ctx.fillStyle = '#1e1826'; ctx.fillRect(x - 4, y - 3, 8, 6); ctx.fillRect(x - 3, y - 4, 6, 8);
  const off = [176, 172, 186], on = [255, 220, 90];
  const mix = off.map((v, i) => Math.round(v + (on[i] - v) * t));
  ctx.fillStyle = `rgb(${mix})`; ctx.fillRect(x - 3, y - 2, 6, 4); ctx.fillRect(x - 2, y - 3, 4, 6);
  ctx.fillStyle = t > .5 ? '#fffbe6' : '#e4e2ea'; ctx.fillRect(x - 2, y - 2, 2, 2);
  if (t > .5) { // twinkle pixels
    const k = Math.floor(now / 250 + l.phase) % 4;
    ctx.fillStyle = 'rgba(255,248,200,.9)';
    const s = [[0,-7],[7,0],[0,7],[-7,0]][k]; ctx.fillRect(x + s[0] - 1, y + s[1] - 1, 2, 2);
  }
}

function drawLabels() {
  ctx.font = 'bold 9px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const room of LAYOUT.rooms) {
    const [c0, r0, c1, r1] = room.rects[0];
    const x = (c0 + c1 + 1) / 2 * CELL, y = (r0 + r1 + 1) / 2 * CELL;
    const w = ctx.measureText(room.name).width + 6;
    ctx.fillStyle = 'rgba(18,14,24,.8)'; ctx.fillRect(Math.round(x - w / 2), Math.round(y - 7), Math.round(w), 13);
    ctx.fillStyle = '#ffe9a8'; ctx.fillText(room.name, x, y);
  }
}

let last = performance.now(), lastPaint = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  let animating = false;
  for (const l of lights) {
    const target = l.on ? 1 : 0;
    if (l.level !== target) {
      l.level += Math.sign(target - l.level) * dt / 450;
      l.level = Math.max(0, Math.min(1, l.level));
      animating = true;
    }
  }
  const anyOn = lights.some(l => l.level > 0);
  // repaint every frame while fading, ~10 fps for the idle flicker (chunky, retro)
  if (animating || (anyOn && now - lastPaint > 100) || now - lastPaint > 1000) { paint(now); lastPaint = now; }
  requestAnimationFrame(frame);
}

function paint(now) {
  if (!map.complete) return;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(map, 0, 0);
  // night layer, with light cut out of it
  dc.globalCompositeOperation = 'source-over';
  dc.clearRect(0, 0, PW, PH);
  dc.fillStyle = `rgba(14,12,44,${darkness})`;
  dc.fillRect(0, 0, PW, PH);
  for (const l of lights) {
    if (l.level <= 0) continue;
    const e = l.level * l.level * (3 - 2 * l.level);
    const flick = 1 + 0.025 * Math.sin(now / 420 + l.phase) + 0.012 * Math.sin(now / 97 + l.phase * 3);
    dc.globalCompositeOperation = 'destination-out';
    dc.drawImage(maskedLight(l, e, flick), 0, 0);
  }
  ctx.drawImage(dark, 0, 0);
  // warm glow on top
  ctx.globalCompositeOperation = 'lighter';
  for (const l of lights) {
    if (l.level <= 0) continue;
    const e = l.level * l.level * (3 - 2 * l.level);
    const flick = 1 + 0.025 * Math.sin(now / 420 + l.phase);
    ctx.globalAlpha = 0.32;
    ctx.drawImage(maskedLight(l, e, flick * .85, 'rgb(255,190,80)'), 0, 0);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  for (const l of lights) drawBulb(l, l.level, now);
  if (showLabels) drawLabels();
}

// ---- interaction
function hit(ev) {
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / rect.width * W, y = (ev.clientY - rect.top) / rect.height * H;
  let best = null, bd = 3.2;
  for (const l of lights) { const dd = Math.hypot(l.x - x, l.y - y); if (dd < bd) { bd = dd; best = l; } }
  return best;
}
const tip = document.getElementById('tip');
canvas.addEventListener('click', ev => { const l = hit(ev); if (l) toggle(l); });
canvas.addEventListener('mousemove', ev => {
  const l = hit(ev);
  if (!l) { tip.style.display = 'none'; return; }
  const rect = canvas.getBoundingClientRect();
  tip.style.display = 'block';
  tip.style.left = (l.x / W * rect.width + 4) + 'px';
  tip.style.top = (l.y / H * rect.height + 4) + 'px';
  tip.textContent = `${l.name} · ${l.on ? 'on' : 'off'}`;
});
canvas.addEventListener('mouseleave', () => tip.style.display = 'none');

const legend = document.getElementById('legend');
function renderLegend() {
  legend.innerHTML = '';
  for (const l of lights) {
    const el = document.createElement('div');
    el.className = l.on ? 'on' : '';
    el.innerHTML = `<span class="dot"></span>${l.name}`;
    el.onclick = () => toggle(l);
    legend.appendChild(el);
  }
}
function toggle(l, v) { l.on = v === undefined ? !l.on : v; renderLegend(); }
document.getElementById('allOn').onclick = () => { lights.forEach(l => l.on = true); renderLegend(); };
document.getElementById('allOff').onclick = () => { lights.forEach(l => l.on = false); renderLegend(); };
document.getElementById('dark').oninput = e => { darkness = +e.target.value; paint(performance.now()); };
document.getElementById('labels').onchange = e => { showLabels = e.target.checked; paint(performance.now()); };

// test hooks for screenshots: #on, #off, #mixed
const h = location.hash.slice(1);
if (h === 'on') lights.forEach(l => { l.on = true; l.level = 1; });
if (h === 'mixed') lights.forEach(l => { l.on = ['living','kitchen','m_bedroom','porch_left','porch_right','garage_front_left'].includes(l.id); l.level = l.on ? 1 : 0; });
renderLegend();
map.onload = () => paint(performance.now());
requestAnimationFrame(frame);
</script>
</body>
</html>
